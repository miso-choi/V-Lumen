[project]
name = "vlumen"
version = "1.0.0"
description = "V-LUMEN: Visual Lookup Memory for Embedding Scaling in Vision-Language Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.14.0",
    "peft==0.19.1",
    "accelerate==1.14.0",
    "datasets==5.0.0",
    "huggingface-hub==1.23.0",
    "qwen-vl-utils==0.0.14",
    "pillow==12.3.0",
    "gdown>=5.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vlumen*"]
